[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctlphone"
version = "0.5.0"
description = "Control an authorized Android device from Linux with a CLI, gateway, and MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phonectl = "phone_ctl.cli:main"
phone-mcp = "phone_ctl.mcp_server:main"

[tool.setuptools.packages.find]
include = ["phone_ctl*"]
